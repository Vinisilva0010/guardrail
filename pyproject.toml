[project]
name = "guardrail"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinicius", email = "vns.pontual77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "websockets>=17.2",
]

[project.scripts]
guardrail = "guardrail:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# Alembic writes these files; formatting them would mean every generated
# migration starts out "unformatted" until someone runs the formatter by hand.
exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade
    "SIM",  # simplifiable code
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001", "W291", "UP007", "UP035"]

[tool.mypy]
python_version = "3.12"
# Tests are checked as well: a test constructing an object with a type its
# dataclass forbids is exactly the kind of silent lie that makes a suite
# pass while proving nothing.
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
