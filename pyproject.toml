[project]
name = "guardrail"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinicius", email = "vns.pontual77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "websockets>=17.2",
]

[project.scripts]
guardrail = "guardrail:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
